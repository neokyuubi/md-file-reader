<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Reader - Modern Markdown Viewer</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css"
    id="highlight-theme" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="app">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-bar-content">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>MD Reader</span>
        </div>

        <div class="top-controls">
          <div class="control-group">
            <label>Source</label>
            <select id="sourceSelect" class="select-input">
              <option value="paste">Paste</option>
              <option value="github">GitHub</option>
            </select>
          </div>

          <div class="control-group">
            <label>View</label>
            <select id="layoutSelect" class="select-input">
              <option value="split">Split</option>
              <option value="editor">Editor</option>
              <option value="preview">Preview</option>
            </select>
          </div>

          <div class="control-group">
            <label>Theme</label>
            <select id="themeSelect" class="select-input">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
              <option value="gray">Gray</option>
              <option value="darkgray">Dark Gray</option>
              <option value="sepia">Sepia</option>
              <option value="solarizedlight">Solarized Light</option>
              <option value="solarizeddark">Solarized Dark</option>
              <option value="warm">Warm</option>
              <option value="midnight">Midnight</option>
              <option value="highcontrast">High Contrast</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-container" id="mainContainer">
      <!-- Editor Panel -->
      <div class="panel editor-panel" id="editorPanel">
        <div class="panel-header">
          <div class="panel-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span>Editor</span>
          </div>
          <div class="panel-actions">
            <button id="clearBtn" class="btn-secondary">Clear</button>
            <button id="renderBtn" class="btn-primary">Render</button>
          </div>
        </div>

        <div class="panel-content">
          <!-- GitHub Input -->
          <div id="githubInput" class="input-section" style="display: none">
            <div class="input-wrapper">
              <input type="text" id="githubUrl" class="text-input"
                placeholder="owner/repo/path/to/file.md or full GitHub URL" />
              <button id="loadBtn" class="btn-primary">Load</button>
            </div>

            <div class="input-wrapper" style="margin-top: 10px;">
              <div id="authSection">
                <button id="loginBtn" class="btn-secondary"
                  style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                  <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                    <path
                      d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                    </path>
                  </svg>
                  Sign in with GitHub
                </button>
                <div id="userProfile"
                  style="display: none; align-items: center; gap: 10px; background: var(--bg-secondary); padding: 8px; border-radius: 4px; border: 1px solid var(--border-color);">
                  <img id="userAvatar" src="" alt="Avatar" style="width: 24px; height: 24px; border-radius: 50%;">
                  <span id="userName"
                    style="font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                  <button id="logoutBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 12px;">Sign
                    out</button>
                </div>
              </div>
            </div>

            <div id="fileSelectContainer" class="input-wrapper" style="display: none; margin-top: 10px;">
              <label for="fileSelect" style="margin-right: 10px; color: var(--text-secondary);">Select File:</label>
              <select id="fileSelect" class="text-input" style="flex: 1;"></select>
            </div>
          </div>

          <!-- Paste Input -->
          <div id="pasteInput" class="input-section">
            <textarea id="pasteArea" class="editor-textarea"
              placeholder="Paste your markdown here...&#10;&#10;Tip: Press Ctrl+Enter to render"></textarea>
          </div>
        </div>
      </div>

      <!-- Resizable Splitter -->
      <div class="splitter" id="splitter"></div>

      <!-- Preview Panel -->
      <div class="panel preview-panel" id="previewPanel">
        <div class="panel-header">
          <div class="panel-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span>Preview</span>
          </div>
        </div>

        <div class="panel-content">
          <div id="markdown-content" class="markdown-body">
            <div class="empty-state">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                opacity="0.3">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
              <h3>Ready to render</h3>
              <p>
                Paste your markdown in the editor or load from GitHub to see
                the preview here.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div style="text-align: center; padding: 10px; color: var(--text-secondary); font-size: 12px; margin-top: auto;">
    <p>Privacy Info: This application runs entirely in your browser. No data or tokens are stored on our servers.</p>
  </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
  <script type="module" src="script.js"></script>
</body>

</html>
